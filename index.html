<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronos interclubs</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--ink:#16130f;--red:#d4202a;--bg:#f1f2f4;--card:#fff;--mut:#6b6f76}
@media(prefers-color-scheme:dark){:root{--ink:#f1f2f4;--bg:#121110;--card:#1e1c1a;--mut:#9a9da3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header img{width:52px;height:52px}h1{font:21px/1.1 'Archivo Black',sans-serif;margin:0}
h2{font:17px 'Archivo Black',sans-serif;margin:22px 0 8px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid rgba(128,128,128,.2)}
.tap{cursor:pointer}.tap:active{opacity:.7}
.mut{color:var(--mut);font-size:14px}
input,button,select{font:inherit;border-radius:10px;border:1px solid rgba(128,128,128,.4);padding:12px;background:var(--card);color:var(--ink);width:100%;margin-top:8px}
button{cursor:pointer;font-weight:600}button.go{background:var(--red);color:#fff;border-color:var(--red)}
button.small{width:auto;padding:8px 12px;margin:6px 6px 0 0;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.vs{font:18px/1.2 'Archivo Black',sans-serif;margin:0 0 2px}
.side{padding:8px 0}.side+.side{border-top:1px solid rgba(128,128,128,.25)}
.niv{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:#8883;margin-left:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duo button{padding:20px 8px;font:16px 'Archivo Black',sans-serif;color:#fff;border:0;margin:0}
.duo .a{background:var(--red)}.duo .b{background:#16130f}.duo .sel{outline:4px solid #f2c200;outline-offset:2px}.duo button:disabled{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:#8883}
.tag.ok{background:#1f8a4c;color:#fff}.tag.ko{background:#8a1f1f;color:#fff}
.pts{font:30px 'Archivo Black',sans-serif;color:var(--red)}
.err{color:var(--red);font-weight:600;min-height:20px}
.rank{display:flex;gap:12px;align-items:center}.rank b{font:20px 'Archivo Black',sans-serif;width:30px}.rank span{flex:1}.rank em{font:18px 'Archivo Black',sans-serif;font-style:normal;color:var(--red)}
a.lnk{color:var(--mut);font-size:14px;cursor:pointer;text-decoration:underline}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid rgba(128,128,128,.3);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border:0;border-radius:0;padding:16px;background:none;font:15px 'Archivo Black',sans-serif;color:var(--mut)}nav button.on{color:var(--red);box-shadow:inset 0 3px var(--red)}
pre{white-space:pre-wrap;word-break:break-all;background:#8882;padding:10px;border-radius:8px;font-size:13px}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script type="module">
import {firebaseConfig,NOM_CLUB} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,query,orderBy,where,Timestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=document.getElementById('app'),NAV=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inv=new URLSearchParams(location.search).get('i')||'';
let me=null,isAdmin=false,player=null,ready=false,tab='paris',rid=null,mid=null,rens=[],matchs={},mSubs={},bets={},players=[],msg='',inviteTok=null,importJson=null,adminRid=null;
onSnapshot(query(collection(db,'rencontres'),orderBy('debut','desc')),s=>{rens=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{msg='Connexion impossible : vérifie firebase-config.js.';render()});
onSnapshot(query(collection(db,'players'),orderBy('points','desc')),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
let betUnsub=null;
onAuthStateChanged(auth,async u=>{me=u;isAdmin=!!(u&&u.email);player=null;bets={};betUnsub&&betUnsub();
if(u&&!u.email){const s=await getDoc(doc(db,'players',u.uid)).catch(()=>null);player=s&&s.exists()?s.data():null;
betUnsub=onSnapshot(query(collection(db,'bets'),where('uid','==',u.uid)),b=>{bets={};b.forEach(x=>{const d=x.data();bets[d.r+'_'+d.m]=d.choice});render()},()=>{})}
if(isAdmin&&tab==='paris')tab='admin';ready=true;render()});
function loadMatchs(id){if(mSubs[id])return;mSubs[id]=onSnapshot(query(collection(db,'rencontres',id,'matchs'),orderBy('o')),s=>{matchs[id]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})}
const ms=r=>r.debut.toMillis(),open=r=>Date.now()<ms(r);
const fmt=r=>new Date(ms(r)).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const who=p=>`<div>${esc(p.nom)}<span class="niv">${esc(p.niv||'')}</span>${p.pct!=null?` <span class="mut">${esc(p.pct)}% de victoires</span>`:''}${p.stat?` <span class="mut">· ${esc(p.stat)}</span>`:''}</div>`;
const team=(r,k)=>esc(k==='a'?r.a:r.b);
function join(){return`<div class="card"><h2 style="margin-top:0">Rejoindre le jeu</h2><p class="mut">Choisis ton pseudo. Il apparaîtra dans le classement.</p><input id="pseudo" maxlength="20" placeholder="Ton pseudo"><button class="go" data-act="join">Rejoindre</button><p class="err">${esc(msg)}</p></div>`}
function noAccess(){return`<div class="card"><h2 style="margin-top:0">Accès sur invitation</h2><p>Ouvre le lien d'invitation envoyé par le club pour jouer.</p></div>`}
function rencontres(){return rens.map(r=>`<div class="card tap" data-act="open|${r.id}"><p class="vs">${esc(r.a)} <span class="mut">contre</span> ${esc(r.b)}</p><span class="mut">${esc(r.competition)} ${esc(r.journee)} · ${fmt(r)}</span><br><span class="tag">${open(r)?'Paris ouverts':'Paris fermés'}</span></div>`).join('')||'<p class="mut">Aucune rencontre pour le moment.</p>'}
function rencontreView(r){loadMatchs(r.id);const l=matchs[r.id]||[];
return`<p><a class="lnk" data-act="back">‹ Rencontres</a></p><div class="card"><p class="vs">${esc(r.a)} contre ${esc(r.b)}</p><span class="mut">${esc(r.competition)} ${esc(r.journee)} · ${fmt(r)}</span><br><span class="tag">${open(r)?'Paris ouverts jusqu\'au début de la rencontre':'Paris fermés'}</span></div>`+l.map(m=>{const c=bets[r.id+'_'+m.id];return`<div class="card tap" data-act="match|${m.id}"><b>${esc(m.nom)}</b> ${m.winner?`<span class="tag">Victoire : ${team(r,m.winner)}</span>`:''}<br><span class="mut">${m.a.map(p=>esc(p.nom)).join(' / ')} vs ${m.b.map(p=>esc(p.nom)).join(' / ')}</span><br>${c?`<span class="tag ${m.winner?(m.winner===c?'ok':'ko'):''}">Ton pari : ${team(r,c)}${m.winner?(m.winner===c?' · +10':' · raté'):''}</span>`:`<span class="tag">${open(r)?'Pas encore parié':'Pas de pari'}</span>`}</div>`}).join('')}
function matchView(r,m){const c=bets[r.id+'_'+m.id],o=open(r);
return`<p><a class="lnk" data-act="backr">‹ ${esc(r.a)} contre ${esc(r.b)}</a></p><div class="card"><p class="vs">${esc(m.nom)}</p>
<div class="side"><b>${esc(r.a)}</b>${m.a.map(who).join('')}</div><div class="side"><b>${esc(r.b)}</b>${m.b.map(who).join('')}</div>
<div class="duo"><button class="a ${c==='a'?'sel':''}" data-bet="a" ${o?'':'disabled'}>${team(r,'a')}</button><button class="b ${c==='b'?'sel':''}" data-bet="b" ${o?'':'disabled'}>${team(r,'b')}</button></div>
<p class="mut" style="margin:10px 0 0">${o?(c?'Pari enregistré. Tu peux le changer jusqu\'au début de la rencontre.':'Choisis le vainqueur. +10 points si tu as raison.'):'Les paris sont fermés.'}</p>${m.winner?`<p><span class="tag">Victoire : ${team(r,m.winner)}</span> ${c?(m.winner===c?'<span class="tag ok">+10 points</span>':'<span class="tag ko">Raté</span>'):''}</p>`:''}<p class="err">${esc(msg)}</p></div>`}
function classement(){const mine=players.findIndex(p=>p.id===(me&&me.uid));return`<div class="card"><span class="mut">Tes points</span><div class="pts">${player?(players.find(p=>p.id===me.uid)||{points:0}).points:0}</div></div><h2 style="margin-top:0">Classement</h2><div class="card">${players.map((p,i)=>`<div class="rank" style="padding:6px 0"><b>${i+1}</b><span>${esc(p.pseudo)}${p.id===(me&&me.uid)?' <span class="tag">toi</span>':''}</span><em>${p.points}</em></div>`).join('')||'<p class="mut">Aucun joueur pour le moment.</p>'}</div><p class="mut">Les points sont mis à jour après chaque rencontre.</p><p style="text-align:center"><a class="lnk" data-act="toadmin">Admin</a></p>`}
function adminView(){if(!isAdmin)return`<div class="card"><h2 style="margin-top:0">Admin</h2><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Mot de passe"><button class="go" data-act="alogin">Se connecter</button><p class="err">${esc(msg)}</p></div>`;
const link=inviteTok?location.origin+location.pathname+'?i='+inviteTok:'';
let h=`<div class="card"><h2 style="margin-top:0">Lien d'invitation</h2>${link?`<pre>${esc(link)}</pre>`:'<p class="mut">Pas encore de lien.</p>'}<button class="go" data-act="newlink">${link?'Créer un nouveau lien (ferme l\'ancien)':'Créer le lien'}</button></div>
<div class="card"><h2 style="margin-top:0">Importer une rencontre</h2><input id="file" type="file" accept=".json"><input id="dt" type="datetime-local"><p class="mut">Début de la rencontre : plus aucun pari possible après cette heure.</p><button class="go" data-act="import">Importer</button></div><h2>Rencontres</h2>`;
h+=rens.map(r=>{let x=`<div class="card"><b>${esc(r.a)} contre ${esc(r.b)}</b> <span class="mut">${esc(r.journee)} · ${fmt(r)}</span><br><button class="small" data-act="manage|${r.id}">${adminRid===r.id?'Masquer':'Saisir les résultats'}</button><button class="small" data-act="del|${r.id}">Supprimer</button>`;
if(adminRid===r.id){loadMatchs(r.id);x+=(matchs[r.id]||[]).map(m=>`<div class="side"><b>${esc(m.nom)}</b> ${m.winner?`<span class="tag">${team(r,m.winner)}</span>`:''}<br><button class="small" data-act="win|${r.id}|${m.id}|a">${esc(r.a)}</button><button class="small" data-act="win|${r.id}|${m.id}|b">${esc(r.b)}</button><button class="small" data-act="win|${r.id}|${m.id}|">Effacer</button></div>`).join('')}
return x+'</div>'}).join('');
h+=`<div class="card"><h2 style="margin-top:0">Points</h2><button class="go" data-act="calc">Calculer les points</button><p class="mut">À faire après avoir saisi les résultats.</p></div><div class="card"><h2 style="margin-top:0">Joueurs (${players.length})</h2>${players.map(p=>`<div class="rank" style="padding:4px 0"><span>${esc(p.pseudo)}</span><em>${p.points}</em><button class="small" data-act="kick|${p.id}">Retirer</button></div>`).join('')}</div><p class="err">${esc(msg)}</p><p><a class="lnk" data-act="alogout">Se déconnecter</a> · <a class="lnk" data-act="tovote">Retour</a></p>`;return h}
function render(){const keep={};document.querySelectorAll('input').forEach(i=>{if(i.type!=='file')keep[i.id]=i.value});
let h=`<header><img src="logo.png" alt="Logo ${esc(NOM_CLUB)}"><div><h1>Pronos interclubs</h1><span class="mut">${esc(NOM_CLUB)} · points virtuels</span></div></header>`;
if(!ready)h+='<p class="mut">Chargement…</p>';
else if(tab==='admin')h+=adminView();
else if(!player)h+=inv?join():noAccess();
else if(tab==='classement')h+=classement();
else{const r=rens.find(x=>x.id===rid),m=r&&(matchs[r.id]||[]).find(x=>x.id===mid);h+=r?(m?matchView(r,m):rencontreView(r)):rencontres()}
$.innerHTML=h;
NAV.innerHTML=player&&tab!=='admin'?`<button class="${tab==='paris'?'on':''}" data-act="tab|paris">Paris</button><button class="${tab==='classement'?'on':''}" data-act="tab|classement">Classement</button>`:'';
document.querySelectorAll('input').forEach(i=>{if(keep[i.id]!=null&&i.type!=='file'&&i.type!=='number')i.value=keep[i.id]});
if(importJson&&document.getElementById('dt')&&!document.getElementById('dt').value)document.getElementById('dt').value=importJson.debut||''}
async function calc(){const win={};for(const r of rens){(await getDocs(collection(db,'rencontres',r.id,'matchs'))).forEach(m=>{win[r.id+'_'+m.id]=m.data().winner})}
const pts={};(await getDocs(collection(db,'bets'))).forEach(b=>{const d=b.data(),w=win[d.r+'_'+d.m];if(w&&w===d.choice)pts[d.uid]=(pts[d.uid]||0)+10});
const b=writeBatch(db);players.forEach(p=>b.update(doc(db,'players',p.id),{points:pts[p.id]||0}));await b.commit();msg='Points mis à jour.'}
document.addEventListener('change',async e=>{if(e.target.id==='file'&&e.target.files[0]){try{importJson=JSON.parse(await e.target.files[0].text());document.getElementById('dt').value=importJson.debut||'';msg=''}catch{importJson=null;msg='Fichier illisible.'}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-bet]');if(!t)return;msg='';
try{
if(t.dataset.bet){if(!me)return;await setDoc(doc(db,'bets',me.uid+'_'+rid+'_'+mid),{uid:me.uid,r:rid,m:mid,choice:t.dataset.bet});return}
const[a,x,y,z]=t.dataset.act.split('|');
if(a==='tab'){tab=x;rid=mid=null}
else if(a==='open'){rid=x;mid=null}else if(a==='match'){mid=x}else if(a==='backr'){mid=null}else if(a==='back'){rid=mid=null}
else if(a==='join'){const p=document.getElementById('pseudo').value.trim();if(!p){msg='Choisis un pseudo.'}else{const u=me&&!me.email?me:(await signInAnonymously(auth)).user;await setDoc(doc(db,'players',u.uid),{pseudo:p,points:0,invite:inv});player={pseudo:p,points:0};me=u}}
else if(a==='toadmin'){tab='admin';if(isAdmin)inviteTok=(await getDoc(doc(db,'settings','invite'))).data()?.token||null}
else if(a==='tovote'){tab='paris'}
else if(a==='alogin'){await signInWithEmailAndPassword(auth,document.getElementById('em').value,document.getElementById('pw').value);tab='admin';inviteTok=(await getDoc(doc(db,'settings','invite'))).data()?.token||null}
else if(a==='alogout'){await signOut(auth);tab='paris'}
else if(a==='newlink'){inviteTok=crypto.randomUUID().replace(/-/g,'').slice(0,12);await setDoc(doc(db,'settings','invite'),{token:inviteTok})}
else if(a==='import'){if(!importJson){msg='Choisis d\'abord un fichier.'}else{const j=importJson,dt=document.getElementById('dt').value;if(!dt){msg='Indique la date de début.'}else{const id=(j.a+'-'+j.b+'-'+j.journee).replace(/[^A-Za-z0-9-]/g,'');const b=writeBatch(db);b.set(doc(db,'rencontres',id),{a:j.a,b:j.b,competition:j.competition||'',journee:j.journee||'',debut:Timestamp.fromDate(new Date(dt))});j.matchs.forEach((m,i)=>b.set(doc(db,'rencontres',id,'matchs',m.id),{nom:m.nom,a:m.a,b:m.b,o:i,winner:null}));await b.commit();importJson=null;msg='Rencontre importée.'}}}
else if(a==='manage'){adminRid=adminRid===x?null:x}
else if(a==='win'){await updateDoc(doc(db,'rencontres',x,'matchs',y),{winner:z||null})}
else if(a==='del'){if(confirm('Supprimer cette rencontre ?')){const b=writeBatch(db);(matchs[x]||[]).forEach(m=>b.delete(doc(db,'rencontres',x,'matchs',m.id)));b.delete(doc(db,'rencontres',x));await b.commit()}}
else if(a==='calc'){await calc()}
else if(a==='kick'){if(confirm('Retirer ce joueur ?'))await deleteDoc(doc(db,'players',x))}
}catch(err){msg=err.code==='auth/invalid-credential'?'Email ou mot de passe incorrect.':err.code==='permission-denied'?'Action refusée (paris fermés ou lien invalide).':'Action impossible : '+(err.code||err.message)}
render()});
</script></body></html>

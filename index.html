<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronos interclubs</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--ink:#16130f;--red:#d4202a;--bg:#f1f2f4;--card:#fff;--mut:#6b6f76}
@media(prefers-color-scheme:dark){:root{--ink:#f1f2f4;--bg:#121110;--card:#1e1c1a;--mut:#9a9da3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header img{width:52px;height:52px}h1{font:21px/1.1 'Archivo Black',sans-serif;margin:0}
h2{font:17px 'Archivo Black',sans-serif;margin:22px 0 8px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid rgba(128,128,128,.2)}
.tap{cursor:pointer}.tap:active{opacity:.7}
.mut{color:var(--mut);font-size:14px}
input,button,select,textarea{font:inherit;border-radius:10px;border:1px solid rgba(128,128,128,.4);padding:12px;background:var(--card);color:var(--ink);width:100%;margin-top:8px}
button{cursor:pointer;font-weight:600}button.go{background:var(--red);color:#fff;border-color:var(--red)}
button.small{width:auto;padding:8px 12px;margin:6px 6px 0 0;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.vs{font:18px/1.2 'Archivo Black',sans-serif;margin:0 0 2px}
.side{padding:8px 0}.side+.side{border-top:1px solid rgba(128,128,128,.25)}
.niv{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:#8883;margin-left:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duo button{padding:20px 8px;font:16px 'Archivo Black',sans-serif;color:#fff;border:0;margin:0}
.duo .a{background:var(--red)}.duo .b{background:#16130f}.duo .sel{outline:4px solid #f2c200;outline-offset:2px}.duo button:disabled{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:#8883}
.tag.ok{background:#1f8a4c;color:#fff}.tag.ko{background:#8a1f1f;color:#fff}
.pts{font:30px 'Archivo Black',sans-serif;color:var(--red)}
.err{color:var(--red);font-weight:600;min-height:20px}
.rank{display:flex;gap:12px;align-items:center}.rank b{font:20px 'Archivo Black',sans-serif;width:30px}.rank span{flex:1}.rank em{font:18px 'Archivo Black',sans-serif;font-style:normal;color:var(--red)}
a.lnk{color:var(--mut);font-size:14px;cursor:pointer;text-decoration:underline}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid rgba(128,128,128,.3);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border:0;border-radius:0;padding:16px;background:none;font:15px 'Archivo Black',sans-serif;color:var(--mut)}nav button.on{color:var(--red);box-shadow:inset 0 3px var(--red)}
pre{white-space:pre-wrap;word-break:break-all;background:#8882;padding:10px;border-radius:8px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.okm{color:#1f8a4c;font-weight:600;min-height:20px}main.wide{max-width:1100px}@media(min-width:900px){.adm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}}
.clogo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid rgba(128,128,128,.3);flex:none}.clogo.ph{display:flex;align-items:center;justify-content:center;font:11px 'Archivo Black',sans-serif;color:#16130f;background:#e6e7ea}.lgbig{width:68px;height:68px}
.hd{display:flex;align-items:center;gap:10px}.hd>div{flex:1;text-align:center}
.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;justify-items:center}.tcol{text-align:center;padding:4px 6px;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}.tcol+.tcol{border-left:1px solid rgba(128,128,128,.25)}.tn{font:15px 'Archivo Black',sans-serif;margin:4px 0}
.prob{margin-top:16px}.pt{text-align:center;color:var(--mut);margin-bottom:6px}.pr{display:flex;align-items:center;gap:10px}.pr span{font-size:15px;color:var(--mut);min-width:44px;text-align:center}.pr .hi{font-weight:700;font-size:20px;color:var(--ink)}.pbar{flex:1;height:10px;border-radius:6px;background:#5fada9;position:relative}.pbar i{display:block;height:100%;background:#7f7b95;border-radius:6px 0 0 6px}.pbar b{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:#9cc6f5;border-radius:2px}
.atabs{display:flex;gap:8px;margin-bottom:14px}.atabs button{margin:0;flex:1}.atabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script type="module">
import {firebaseConfig,NOM_CLUB} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,query,orderBy,where,Timestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=document.getElementById('app'),NAV=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inv=new URLSearchParams(location.search).get('i')||'';
const PD='@bcv43-pronos.fr',PW='-bcv43';let cardsJson=null,adminTab='rencontres',draft=[],cartes=[],cartesUnsub=null,cEdit=null,noSave=false,clubs={},authMode=inv?'join':'login',uidSeen=null,adminOk=null,msgArea='top',kept={},me=null,isAdmin=false,player=null,ready=false,tab=location.hash==='#admin'?'admin':'paris',rid=null,mid=null,rens=[],matchs={},mSubs={},bets={},players=[],msg='',inviteTok=null,importJson=null,adminRid=null;
onSnapshot(query(collection(db,'rencontres'),orderBy('debut','desc')),s=>{rens=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{msg='Connexion impossible : vérifie firebase-config.js.';render()});
onSnapshot(query(collection(db,'players'),orderBy('points','desc')),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
onSnapshot(collection(db,'clubs'),s=>{clubs={};s.forEach(d=>clubs[d.id]=d.data());render()},()=>{});
let betUnsub=null;
onAuthStateChanged(auth,async u=>{me=u;isAdmin=!!(u&&u.email&&!u.email.endsWith(PD));if(!u||u.uid!==uidSeen){player=null}uidSeen=u?u.uid:null;bets={};betUnsub&&betUnsub();betUnsub=null;cartesUnsub&&cartesUnsub();cartesUnsub=null;cartes=[];
if(u&&!isAdmin){const s=await getDoc(doc(db,'players',u.uid)).catch(()=>null);if(s&&s.exists())player=s.data();
betUnsub=onSnapshot(query(collection(db,'bets'),where('uid','==',u.uid)),b=>{bets={};b.forEach(x=>{const d=x.data();bets[d.r+'_'+d.m]=d.choice});render()},()=>{})}
if(isAdmin){cartesUnsub=onSnapshot(collection(db,'cartes'),sn=>{cartes=sn.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.nom+x.prenom).localeCompare(y.nom+y.prenom));render()},()=>{});await checkAdmin();if(tab==='paris')tab='admin'}ready=true;render()});
function loadMatchs(id){if(mSubs[id])return;mSubs[id]=onSnapshot(query(collection(db,'rencontres',id,'matchs'),orderBy('o')),s=>{matchs[id]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})}
const ms=r=>r.debut.toMillis(),open=r=>Date.now()<ms(r);
const fmt=r=>new Date(ms(r)).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const who=p=>`<div>${esc(p.nom)}<span class="niv">${esc(p.niv||'')}</span>${p.pct!=null?` <span class="mut">${esc(p.pct)}% de victoires</span>`:''}${p.pts!=null?` <span class="mut">· ${esc(p.pts)} pts</span>`:''}${p.stat?` <span class="mut">· ${esc(p.stat)}</span>`:''}</div>`;
const team=(r,k)=>esc(k==='a'?r.a:r.b);
const ckey=t=>String(t).split('-')[0].trim().toUpperCase();
const lgk=(k,big)=>{const u=(clubs[k]&&clubs[k].logo)||(/^(BC2V43|BCV43|BCV)$/.test(k)?'logo.png':'');return u?`<img class="clogo ${big?'lgbig':''}" src="${u}" alt="Logo ${esc(k)}">`:`<div class="clogo ph ${big?'lgbig':''}">${esc(k.slice(0,3))}</div>`};
const lg=(t,big)=>lgk(ckey(t),big);
const slug=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pEmail=(pr,nm)=>slug(pr)+'.'+slug(nm)+PD,pPass=(pr,nm)=>'bcv43-'+slug(pr)+'-'+slug(nm);
function authView(){return`<div class="card"><h2 style="margin-top:0">${inv?'Rejoindre le jeu':'Se connecter'}</h2><p class="mut">${inv?'Entre ton prénom et ton nom. Si tu reviens plus tard, entre les mêmes pour retrouver ton compte.':'Entre ton prénom et ton nom pour retrouver ton compte.'}</p><div class="row2"><input id="prenom" placeholder="Prénom" autocomplete="given-name"><input id="nom" placeholder="Nom" autocomplete="family-name"></div><button class="go" data-act="enter">${inv?'Entrer':'Se connecter'}</button><p class="err">${esc(msg)}</p></div><p style="text-align:center">${inv?'':'<span class="mut">Pas encore inscrit ? Ouvre le lien d\'invitation du club.</span> · '}<a class="lnk" data-act="toadmin">Admin</a></p>`}
function rencontres(){return rens.map(r=>`<div class="card tap" data-act="open|${r.id}"><div class="hd">${lg(r.a)}<div><p class="vs">${esc(r.a)} <span class="mut">contre</span> ${esc(r.b)}</p><span class="mut">${esc(r.competition)} ${esc(r.journee)} · ${fmt(r)}</span><br><span class="tag">${open(r)?'Paris ouverts':'Paris fermés'}</span></div>${lg(r.b)}</div></div>`).join('')||'<p class="mut">Aucune rencontre pour le moment.</p>'}
function rencontreView(r){loadMatchs(r.id);const l=matchs[r.id]||[];
return`<p><a class="lnk" data-act="back">‹ Rencontres</a></p><div class="card"><div class="hd">${lg(r.a,1)}<div><p class="vs">${esc(r.a)} contre ${esc(r.b)}</p><span class="mut">${esc(r.competition)} ${esc(r.journee)} · ${fmt(r)}</span><br><span class="tag">${open(r)?'Paris ouverts jusqu\'au début':'Paris fermés'}</span></div>${lg(r.b,1)}</div></div>`+l.map(m=>{const c=bets[r.id+'_'+m.id];return`<div class="card tap" data-act="match|${m.id}"><b>${esc(m.nom)}</b> ${m.winner?`<span class="tag">Victoire : ${team(r,m.winner)}</span>`:''}<br><span class="mut">${m.a.map(p=>esc(p.nom)).join(' / ')} vs ${m.b.map(p=>esc(p.nom)).join(' / ')}</span><br>${c?`<span class="tag ${m.winner?(m.winner===c?'ok':'ko'):''}">Ton pari : ${team(r,c)}${m.winner?(m.winner===c?' · +10':' · raté'):''}</span>`:`<span class="tag">${open(r)?'Pas encore parié':'Pas de pari'}</span>`}</div>`}).join('')}
const winPct=m=>{if(m.pa!=null)return m.pa;const sum=l=>l.every(p=>typeof p.pts==='number')?l.reduce((t,p)=>t+p.pts,0):null,sa=sum(m.a),sb=sum(m.b);return sa!=null&&sb!=null&&sa+sb>0?Math.round(sa/(sa+sb)*100):null};
const probBar=m=>{const a=winPct(m);if(a==null)return'';const b=100-a;return`<div class="prob"><div class="pt">Probabilité de victoire</div><div class="pr"><span class="${a>=b?'hi':''}">${a}%</span><div class="pbar"><i style="width:${a}%"></i><b style="left:${a}%"></b></div><span class="${b>a?'hi':''}">${b}%</span></div></div>`};
function matchView(r,m){const c=bets[r.id+'_'+m.id],o=open(r);
const col=k=>`<div class="tcol">${lg(k==='a'?r.a:r.b,1)}<div class="tn">${team(r,k)}</div>${m[k].map(who).join('')}</div>`;
return`<p><a class="lnk" data-act="backr">‹ ${esc(r.a)} contre ${esc(r.b)}</a></p><div class="card"><p class="vs" style="text-align:center">${esc(m.nom)}</p><div class="vsrow">${col('a')}${col('b')}</div>${probBar(m)}
<div class="duo"><button class="a ${c==='a'?'sel':''}" data-bet="a" ${o?'':'disabled'}>${team(r,'a')}</button><button class="b ${c==='b'?'sel':''}" data-bet="b" ${o?'':'disabled'}>${team(r,'b')}</button></div>
<p class="mut" style="margin:10px 0 0;text-align:center">${o?(c?'Pari enregistré. Tu peux le changer jusqu\'au début de la rencontre.':'Choisis le vainqueur. +10 points si tu as raison.'):'Les paris sont fermés.'}</p>${m.winner?`<p style="text-align:center"><span class="tag">Victoire : ${team(r,m.winner)}</span> ${c?(m.winner===c?'<span class="tag ok">+10 points</span>':'<span class="tag ko">Raté</span>'):''}</p>`:''}<p class="err">${esc(msg)}</p></div>`}
function classement(){return`<div class="card"><span class="mut">Tes points${player&&player.prenom?' · '+esc(player.prenom):''}</span><div class="pts">${(players.find(p=>p.id===(me&&me.uid))||{points:0}).points}</div></div><h2 style="margin-top:0">Classement</h2><div class="card">${players.map((p,i)=>`<div class="rank" style="padding:6px 0"><b>${i+1}</b><span>${esc(p.pseudo)}${p.id===(me&&me.uid)?' <span class="tag">toi</span>':''}</span><em>${p.points}</em></div>`).join('')||'<p class="mut">Aucun joueur pour le moment.</p>'}</div><p class="mut">Les points sont mis à jour après chaque rencontre.</p><p style="text-align:center"><a class="lnk" data-act="plogout">Se déconnecter</a> · <a class="lnk" data-act="toadmin">Admin</a></p>`}
const LEVELS=['N1','N2','N3','R4','R5','R6','D7','D8','D9','P10','P11','P12','NC'],TYPELIST=['SH1','SH2','SH3','SD1','SD2','SD3','DH1','DH2','DD1','DD2','MX1','MX2','MX3'],LBL={S:'simple',D:'double',M:'mixte'};
const disc=t=>t[0]==='S'?'S':t[0]==='M'?'M':'D',typeName=t=>(TYPES[t.slice(0,2)]||t.slice(0,2))+' '+t.slice(2),shortName=c=>c.nom.toUpperCase()+' '+c.prenom.charAt(0).toUpperCase()+'.',clabel=c=>c.nom.toUpperCase()+' '+c.prenom+(c.club?' ('+c.club+')':'');
const isOk=()=>/^(Rencontre créée|Points mis|Logo enregistré|Carte enregistrée|Match ajouté|Cartes importées|\d+ joueurs? prêts?)/.test(msg),mbox=a=>msgArea===a&&msg?`<p class="${isOk()?'okm':'err'}">${esc(msg)}</p>`:'';
const opts=side=>{const k=ckey(kept[side==='a'?'ea':'eb']||''),m=cartes.filter(c=>c.club&&k&&(ckey(c.club)===k||ckey(c.club).startsWith(k)||k.startsWith(ckey(c.club))));return m.length?m:cartes};
function builder(){if(!cartes.length)return'<p class="mut">Ajoute d\'abord des cartes joueur (onglet « Cartes joueur »).</p>';
const t=kept.mtype||'',n=t?(disc(t)==='S'?1:2):0,sel=(id,side)=>`<select id="${id}"><option value="">Joueur…</option>${opts(side).map(c=>`<option value="${c.id}">${esc(clabel(c))}</option>`).join('')}</select>`;
return`<select id="mtype"><option value="">Type de match…</option>${TYPELIST.map(x=>`<option value="${x}">${esc(typeName(x))}</option>`).join('')}</select>${n?`<div class="row2"><div><span class="mut">${esc(kept.ea||'Équipe 1')}</span>${[1,2].slice(0,n).map(i=>sel('a'+i,'a')).join('')}</div><div><span class="mut">${esc(kept.eb||'Équipe 2')}</span>${[1,2].slice(0,n).map(i=>sel('b'+i,'b')).join('')}</div></div><button data-act="addm">Ajouter ce match</button>`:''}`}
function cartesView(){const lv=k=>`<div class="row2"><select id="n${k}"><option value="">Classement ${LBL[k]}</option>${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select><input id="p${k}" inputmode="decimal" placeholder="Points ${LBL[k]}"></div>`;
const form=`<div class="card"><h2 style="margin-top:0">${cEdit?'Modifier la carte':'Nouvelle carte joueur'}</h2><div class="row2"><input id="cp" placeholder="Prénom"><input id="cn" placeholder="Nom"></div><input id="cc" placeholder="Club (ex. VDD63), facultatif">${lv('S')}${lv('D')}${lv('M')}<div class="row2"><input id="cm" inputmode="numeric" placeholder="Matchs joués (ex. 6)"><input id="cv" inputmode="decimal" placeholder="% de victoires (ex. 33)"></div><button class="go" data-act="savec">Enregistrer la carte</button>${mbox('cartes')}</div>`;
const list=`<h2 style="margin-top:0">Cartes (${cartes.length})</h2>`+(cartes.map(c=>`<div class="card"><b>${esc(c.nom.toUpperCase())} ${esc(c.prenom)}</b> <span class="mut">${esc(c.club||'')}</span><br><span class="mut">${['S','D','M'].map(k=>`${LBL[k]} ${esc((c.niv&&c.niv[k])||'–')}${c.pts&&c.pts[k]!=null?' · '+c.pts[k]+' pts':''}`).join(' | ')}${c.nb!=null?' · '+c.nb+' m.':''}${c.pct!=null?' · '+c.pct+'%':''}</span><br><button class="small" data-act="editc|${c.id}">Modifier</button><button class="small" data-act="delc|${c.id}">Supprimer</button></div>`).join('')||'<p class="mut">Aucune carte pour le moment.</p>');
const imp=`<div class="card"><h2 style="margin-top:0">Importer des cartes</h2><p class="mut">Choisis le fichier .json préparé à partir d'une capture eBad. Un joueur déjà présent est mis à jour, jamais dupliqué.</p><input id="cfile" type="file" accept=".json"><button class="go" data-act="impc">Importer</button></div>`;
return`<div class="adm"><div>${imp}${form}</div><div>${list}</div></div>`}
function adminView(){if(!isAdmin)return`<div class="card"><h2 style="margin-top:0">Admin</h2><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Mot de passe"><button class="go" data-act="alogin">Se connecter</button><p class="err">${esc(msg)}</p></div>`;
const link=inviteTok?location.origin+location.pathname+'?i='+inviteTok:'';
const warn=adminOk===false?`<div class="card" style="border-color:var(--red)"><b class="err">Droits admin non reconnus par Firebase.</b><p>Dans Firebase : Firestore Database > Règles, colle tout le contenu du fichier <b>firestore.rules</b>, clique sur Publier, puis recharge cette page.</p></div>`:'';
const tabs=`<div class="atabs"><button class="${adminTab==='rencontres'?'on':''}" data-act="atab|rencontres">Rencontres</button><button class="${adminTab==='cartes'?'on':''}" data-act="atab|cartes">Cartes joueur</button></div>`;
const foot=`<p><a class="lnk" data-act="alogout">Se déconnecter</a> · <a class="lnk" data-act="tovote">Retour</a></p>`;
if(adminTab==='cartes')return warn+tabs+cartesView()+foot;
const dr=draft.map((m,i)=>`<div class="rank" style="padding:4px 0"><span><b>${esc(m.id)}</b> <span class="mut">${m.a.map(p=>esc(p.nom)).join(' + ')} contre ${m.b.map(p=>esc(p.nom)).join(' + ')}</span></span><button class="small" data-act="rmd|${i}">Retirer</button></div>`).join('');
const left=`<div class="card"><h2 style="margin-top:0">Lien d'invitation</h2>${link?`<pre>${esc(link)}</pre>`:'<p class="mut">Pas encore de lien.</p>'}<button class="go" data-act="newlink">${link?'Créer un nouveau lien (ferme l\'ancien)':'Créer le lien'}</button>${mbox('top')}</div>
<div class="card"><h2 style="margin-top:0">Nouvelle rencontre</h2><div class="row2"><input id="ea" placeholder="Équipe 1 (ex. VDD63-4)"><input id="eb" placeholder="Équipe 2 (ex. BC2V43-2)"></div><div class="row2"><input id="comp" placeholder="Compétition (ex. Régionale 3)"><input id="jour" placeholder="Journée (ex. J4)"></div><div class="row2"><input id="date" type="date"><input id="heure" type="time"></div><p class="mut">Heure de début : les paris ferment à ce moment. Date, heure et compétition sont gardées pour la rencontre suivante.</p>
<b>Matchs de la rencontre</b>${dr||'<p class="mut">Aucun match ajouté.</p>'}${builder()}<p class="mut">La probabilité de victoire se calcule avec les points des cartes joueur, quand ils sont tous renseignés.</p><button class="go" data-act="create">Créer la rencontre</button>${mbox('form')}</div>
<div class="card"><h2 style="margin-top:0">Logos des clubs</h2>${[...new Set(rens.flatMap(r=>[ckey(r.a),ckey(r.b)]))].map(k=>`<div class="rank" style="padding:6px 0">${lgk(k)}<span>${esc(k)}</span><input type="file" accept="image/*" data-logo="${esc(k)}" style="width:auto;max-width:55%"></div>`).join('')||'<p class="mut">Crée d\'abord une rencontre.</p>'}${mbox('logos')}</div>`;
const rl=rens.map(r=>{let x=`<div class="card"><b>${esc(r.a)} contre ${esc(r.b)}</b> <span class="mut">${esc(r.journee)} · ${fmt(r)}</span><br><button class="small" data-act="manage|${r.id}">${adminRid===r.id?'Masquer':'Saisir les résultats'}</button><button class="small" data-act="del|${r.id}">Supprimer</button>`;
if(adminRid===r.id){loadMatchs(r.id);x+=(matchs[r.id]||[]).map(m=>`<div class="side"><b>${esc(m.nom)}</b> ${m.winner?`<span class="tag">${team(r,m.winner)}</span>`:''}<br><button class="small" data-act="win|${r.id}|${m.id}|a">${esc(r.a)}</button><button class="small" data-act="win|${r.id}|${m.id}|b">${esc(r.b)}</button><button class="small" data-act="win|${r.id}|${m.id}|">Effacer</button></div>`).join('')}
return x+'</div>'}).join('')||'<p class="mut">Aucune rencontre.</p>';
const right=`<h2 style="margin-top:0">Rencontres</h2>${rl}<div class="card"><h2 style="margin-top:0">Points</h2><button class="go" data-act="calc">Calculer les points</button><p class="mut">À faire après avoir saisi les résultats.</p>${mbox('pts')}</div><div class="card"><h2 style="margin-top:0">Joueurs inscrits (${players.length})</h2>${players.map(p=>`<div class="rank" style="padding:4px 0"><span>${esc(p.prenom?p.prenom+' '+p.nom:p.pseudo)}</span><em>${p.points}</em><button class="small" data-act="kick|${p.id}">Retirer</button></div>`).join('')||'<p class="mut">Aucun joueur.</p>'}</div>`;
return warn+tabs+`<div class="adm"><div>${left}</div><div>${right}</div></div>`+foot}
function render(){if(!noSave)document.querySelectorAll('input,textarea,select').forEach(i=>{if(i.type!=='file')kept[i.id]=i.value});noSave=false;
let h=`<header><img src="logo.png" alt="Logo ${esc(NOM_CLUB)}"><div><h1>Pronos interclubs</h1><span class="mut">${esc(NOM_CLUB)} · points virtuels</span></div></header>`;
if(!ready)h+='<p class="mut">Chargement…</p>';
else if(tab==='admin')h+=adminView();
else if(!player)h+=authView();
else if(tab==='classement')h+=classement();
else{const r=rens.find(x=>x.id===rid),m=r&&(matchs[r.id]||[]).find(x=>x.id===mid);h+=r?(m?matchView(r,m):rencontreView(r)):rencontres()}
$.innerHTML=h;$.className=tab==='admin'&&isAdmin?'wide':'';
NAV.innerHTML=player&&tab!=='admin'?`<button class="${tab==='paris'?'on':''}" data-act="tab|paris">Paris</button><button class="${tab==='classement'?'on':''}" data-act="tab|classement">Classement</button>`:'';
document.querySelectorAll('input,textarea,select').forEach(i=>{if(kept[i.id]!=null&&i.type!=='file')i.value=kept[i.id]});
if(importJson&&document.getElementById('dt')&&!document.getElementById('dt').value)document.getElementById('dt').value=importJson.debut||''}
const TYPES={SH:'Simple hommes',SD:'Simple dames',DH:'Double hommes',DD:'Double dames',MX:'Mixte'};
function parseMatchs(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const[main,pp]=l.split('|');const[k,r]=main.split(':');const id=k.toUpperCase().replace(/[^A-Z0-9]/g,'');const sd=(r||'').split('/').map(x=>x.split('+').map(p=>{p=p.trim();const m=p.match(/^(.*?)\s+([NRDP]\d{1,2})(?:\s+(\d+(?:[.,]\d+)?))?$/i);if(!m)return{nom:p,niv:''};const o={nom:m[1].trim(),niv:m[2].toUpperCase()};if(m[3])o.pts=parseFloat(m[3].replace(',','.'));return o}).filter(p=>p.nom));if(sd.length!==2||!id||!sd[0].length||!sd[1].length)throw new Error('Ligne invalide : '+l);const pn=pp?parseInt(pp):NaN;return{id,nom:(TYPES[id.slice(0,2)]||id.slice(0,2))+' '+id.slice(2),a:sd[0],b:sd[1],o:i,pa:pn>=0&&pn<=100?pn:null}})}
const shrink=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,96/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/png'))};i.onerror=rej;i.src=URL.createObjectURL(f)});
document.addEventListener('change',async e=>{const k=e.target.dataset&&e.target.dataset.logo;if(k&&e.target.files[0]){msgArea='logos';try{await setDoc(doc(db,'clubs',k),{logo:await shrink(e.target.files[0])});msg='Logo enregistré.'}catch(er){msg='Logo impossible : '+(er.code||er.message)}render()}});
async function checkAdmin(){try{inviteTok=(await getDoc(doc(db,'settings','invite'))).data()?.token||null;adminOk=true}catch(e){adminOk=false}}
document.addEventListener('change',e=>{if(e.target.id==='mtype')render()});
document.addEventListener('change',async e=>{if(e.target.id==='cfile'&&e.target.files[0]){msgArea='cartes';try{cardsJson=JSON.parse(await e.target.files[0].text());msg=(cardsJson.joueurs||[]).length+' joueurs prêts à importer.'}catch{cardsJson=null;msg='Fichier illisible.'}render()}});
async function calc(){const win={};for(const r of rens){(await getDocs(collection(db,'rencontres',r.id,'matchs'))).forEach(m=>{win[r.id+'_'+m.id]=m.data().winner})}
const pts={};(await getDocs(collection(db,'bets'))).forEach(b=>{const d=b.data(),w=win[d.r+'_'+d.m];if(w&&w===d.choice)pts[d.uid]=(pts[d.uid]||0)+10});
const b=writeBatch(db);players.forEach(p=>b.update(doc(db,'players',p.id),{points:pts[p.id]||0}));await b.commit();msg='Points mis à jour.'}
document.addEventListener('change',async e=>{if(e.target.id==='file'&&e.target.files[0]){try{importJson=JSON.parse(await e.target.files[0].text());document.getElementById('dt').value=importJson.debut||'';msg=''}catch{importJson=null;msg='Fichier illisible.'}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-bet]');if(!t)return;msg='';{const ac=(t.dataset.act||'').split('|')[0];msgArea=ac==='calc'?'pts':(ac==='create'||ac==='addm'||ac==='rmd')?'form':(ac==='savec'||ac==='delc'||ac==='editc'||ac==='impc')?'cartes':'top'}
try{
if(t.dataset.bet){if(!me)return;await setDoc(doc(db,'bets',me.uid+'_'+rid+'_'+mid),{uid:me.uid,r:rid,m:mid,choice:t.dataset.bet});return}
const[a,x,y,z]=t.dataset.act.split('|');
if(a==='tab'){tab=x;rid=mid=null}
else if(a==='open'){rid=x;mid=null}else if(a==='match'){mid=x}else if(a==='backr'){mid=null}else if(a==='back'){rid=mid=null}
else if(a==='enter'){const pr=document.getElementById('prenom').value.trim(),nm=document.getElementById('nom').value.trim();
if(!pr||!nm){msg='Indique ton prénom et ton nom.'}else{const em=pEmail(pr,nm),pw=pPass(pr,nm);let u;
try{u=(await signInWithEmailAndPassword(auth,em,pw)).user}catch(er){if(er.code!=='auth/invalid-credential'&&er.code!=='auth/user-not-found')throw er;
if(!inv)throw new Error('Nom inconnu. Ouvre le lien d\'invitation du club pour t\'inscrire.');
try{u=(await createUserWithEmailAndPassword(auth,em,pw)).user}catch(e2){throw e2.code==='auth/email-already-in-use'?new Error('Ce nom correspond à un ancien compte de test : demande à l\'admin de le supprimer.'):e2}}
uidSeen=u.uid;const sn=await getDoc(doc(db,'players',u.uid));
if(sn.exists()){player=sn.data()}else{if(!inv)throw new Error('Inscription incomplète : ouvre le lien d\'invitation du club.');const d={pseudo:pr+' '+nm.charAt(0).toUpperCase()+'.',prenom:pr,nom:nm,points:0,invite:inv};await setDoc(doc(db,'players',u.uid),d);player=d}me=u}}
else if(a==='plogout'){await signOut(auth);tab='paris';rid=mid=null}
else if(a==='toadmin'){tab='admin';if(isAdmin)await checkAdmin()}
else if(a==='tovote'){tab='paris'}
else if(a==='alogin'){await signInWithEmailAndPassword(auth,document.getElementById('em').value,document.getElementById('pw').value);tab='admin'}
else if(a==='alogout'){await signOut(auth);tab='paris'}
else if(a==='newlink'){const t2=crypto.randomUUID().replace(/-/g,'').slice(0,12);await setDoc(doc(db,'settings','invite'),{token:t2});inviteTok=t2;adminOk=true}
else if(a==='import'){if(!importJson){msg='Choisis d\'abord un fichier.'}else{const j=importJson,dt=document.getElementById('dt').value;if(!dt){msg='Indique la date de début.'}else{const id=(j.a+'-'+j.b+'-'+j.journee).replace(/[^A-Za-z0-9-]/g,'');const b=writeBatch(db);b.set(doc(db,'rencontres',id),{a:j.a,b:j.b,competition:j.competition||'',journee:j.journee||'',debut:Timestamp.fromDate(new Date(dt))});j.matchs.forEach((m,i)=>b.set(doc(db,'rencontres',id,'matchs',m.id),{nom:m.nom,a:m.a,b:m.b,o:i,winner:null}));await b.commit();importJson=null;msg='Rencontre importée.'}}}
else if(a==='create'){const g=i=>document.getElementById(i).value.trim(),ea=g('ea'),eb=g('eb'),jour=g('jour'),date=g('date'),heure=g('heure');if(!ea||!eb||!date||!heure){msg='Renseigne les deux équipes, la date et l\'heure.'}else{const l=draft;if(!l.length)throw new Error('Ajoute au moins un match à la rencontre.');const id=(ea+'-'+eb+'-'+jour).replace(/[^A-Za-z0-9-]/g,'');const b=writeBatch(db);b.set(doc(db,'rencontres',id),{a:ea,b:eb,competition:g('comp'),journee:jour,debut:Timestamp.fromDate(new Date(date+'T'+heure))});l.forEach(m=>b.set(doc(db,'rencontres',id,'matchs',m.id),{nom:m.nom,a:m.a,b:m.b,o:m.o,pa:m.pa==null?null:m.pa,winner:null}));await b.commit();kept.ea=kept.eb='';draft=[];noSave=true;msg='Rencontre créée. Tu peux en ajouter une autre.'}}
else if(a==='atab'){adminTab=x}
else if(a==='addm'){const t=document.getElementById('mtype').value;if(!t)throw new Error('Choisis le type de match.');const d=disc(t),n=d==='S'?1:2;if(draft.some(m=>m.id===t))throw new Error('Le match '+t+' est déjà ajouté.');
const pick=side=>{const ids=[];for(let i=1;i<=n;i++){const v=document.getElementById(side+i).value;if(!v)throw new Error('Choisis tous les joueurs.');ids.push(v)}if(new Set(ids).size<ids.length)throw new Error('Un joueur est choisi deux fois dans la même équipe.');return ids.map(id=>{const c=cartes.find(z=>z.id===id),o={nom:shortName(c),niv:(c.niv&&c.niv[d])||''};const pt=c.pts&&c.pts[d];if(typeof pt==='number')o.pts=pt;if(typeof c.pct==='number')o.pct=c.pct;if(typeof c.nb==='number')o.stat=c.nb+' matchs';return o})};
const ma=pick('a'),mb2=pick('b');draft.push({id:t,nom:typeName(t),a:ma,b:mb2,o:draft.length,pa:null});['a1','a2','b1','b2','mtype'].forEach(k=>kept[k]='');noSave=true;msg='Match ajouté.'}
else if(a==='rmd'){draft.splice(+x,1)}
else if(a==='savec'){const g=i=>document.getElementById(i).value.trim(),pr=g('cp'),nmv=g('cn');if(!pr||!nmv)throw new Error('Indique le prénom et le nom.');const niv={},pts={};['S','D','M'].forEach(k=>{niv[k]=g('n'+k);const v=parseFloat(g('p'+k).replace(',','.'));if(!isNaN(v))pts[k]=v});
const id=slug(nmv+' '+pr);const cd={prenom:pr,nom:nmv,club:g('cc'),niv,pts},nb=parseInt(g('cm')),pc=parseFloat(g('cv').replace(',','.'));if(!isNaN(nb))cd.nb=nb;if(!isNaN(pc))cd.pct=pc;await setDoc(doc(db,'cartes',id),cd);if(cEdit&&cEdit!==id)await deleteDoc(doc(db,'cartes',cEdit));cEdit=null;['cp','cn','cc','nS','nD','nM','pS','pD','pM','cm','cv'].forEach(k=>kept[k]='');noSave=true;msg='Carte enregistrée.'}
else if(a==='editc'){const c=cartes.find(z=>z.id===x);cEdit=x;kept.cp=c.prenom;kept.cn=c.nom;kept.cc=c.club||'';kept.cm=c.nb!=null?String(c.nb):'';kept.cv=c.pct!=null?String(c.pct):'';['S','D','M'].forEach(k=>{kept['n'+k]=(c.niv&&c.niv[k])||'';kept['p'+k]=c.pts&&c.pts[k]!=null?String(c.pts[k]):''});noSave=true;window.scrollTo({top:0,behavior:'smooth'})}
else if(a==='impc'){if(!cardsJson)throw new Error('Choisis d\'abord un fichier.');const map=new Map();(cardsJson.joueurs||[]).forEach(j=>{if(!j.nom||!j.prenom)return;const d={prenom:j.prenom,nom:j.nom,club:j.club||cardsJson.club||'',niv:j.niv||{},pts:j.pts||{}};if(typeof j.nb==='number')d.nb=j.nb;if(typeof j.pct==='number')d.pct=j.pct;map.set(slug(j.nom+' '+j.prenom),d)});
const ex=new Set(cartes.map(c=>c.id));let nw=0,up=0;const b=writeBatch(db);map.forEach((d,id)=>{ex.has(id)?up++:nw++;b.set(doc(db,'cartes',id),d,{merge:true})});await b.commit();cardsJson=null;msg='Cartes importées : '+nw+' nouvelle(s), '+up+' mise(s) à jour, aucun doublon.'}
else if(a==='delc'){if(confirm('Supprimer cette carte ?'))await deleteDoc(doc(db,'cartes',x))}
else if(a==='manage'){adminRid=adminRid===x?null:x}
else if(a==='win'){await updateDoc(doc(db,'rencontres',x,'matchs',y),{winner:z||null})}
else if(a==='del'){if(confirm('Supprimer cette rencontre ?')){const b=writeBatch(db);(matchs[x]||[]).forEach(m=>b.delete(doc(db,'rencontres',x,'matchs',m.id)));b.delete(doc(db,'rencontres',x));await b.commit()}}
else if(a==='calc'){await calc()}
else if(a==='kick'){if(confirm('Retirer ce joueur ?'))await deleteDoc(doc(db,'players',x))}
}catch(err){msg=err.code==='auth/invalid-credential'?'Email ou mot de passe incorrect.':err.code==='permission-denied'?(isAdmin?'Firebase refuse cette action : republie la dernière version des règles (fichier firestore.rules, puis Publier).':'Action refusée (paris fermés ou lien invalide).'):err.code==='auth/admin-restricted-operation'?'La connexion « Anonyme » n\'est pas activée dans Firebase (Authentication > Méthode de connexion > Ajouter un fournisseur > Anonyme).':(err.code?'Action impossible : '+err.code:err.message)}
render()});
